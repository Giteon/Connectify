<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectifyAI — Graphs meet Knowledge meet AI</title>
  <script>
    /* Dark mode is the landing page default. Honors a stored `cfg.theme`
       from elsewhere in the app — only `light` opts out. */
    try {
      if (localStorage.getItem('cfg.theme') !== 'light') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="landing-page.css" />
</head>
<body>
  <header class="lp-topnav">
    <a class="lp-brand" href="landing-page.html">
      <img src="icons/logo.png" width="32" height="32" alt="" decoding="async" />
      <span class="lp-brand-wordmark">Connectify</span>
    </a>

    <nav class="lp-nav-links" aria-label="Primary">
      <button type="button" class="lp-nav-link">
        Product
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <button type="button" class="lp-nav-link">
        Solutions
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <button type="button" class="lp-nav-link">
        Resources
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <a class="lp-nav-link" href="#">Pricing</a>
    </nav>

    <div class="lp-nav-cta">
      <a class="lp-btn lp-btn-ghost" href="graphs-hub.html?tab=dashboard">Login</a>
      <a class="lp-btn lp-btn-primary" href="graphs-hub.html?tab=dashboard&amp;new=1">Start building</a>
    </div>
  </header>

  <aside class="lp-toolbar" id="lpToolbar" aria-label="Demo controls">
    <button type="button" class="lp-toolbar-btn" data-tool="shuffle" aria-label="Shuffle headline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M16 21h5v-5"/><path d="M21 21l-7-7"/><path d="M3 3l7 7"/><path d="M3 21l7-7"/></svg>
      <span class="lp-toolbar-tip">Shuffle</span>
    </button>
    <button type="button" class="lp-toolbar-btn" data-tool="reset" aria-label="Tidy up">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="lp-toolbar-tip">Tidy up</span>
    </button>
    <span class="lp-toolbar-sep" aria-hidden="true"></span>
    <button type="button" class="lp-toolbar-btn" data-tool="theme" aria-label="Toggle dark mode">
      <svg class="lp-toolbar-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="lp-toolbar-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="lp-toolbar-tip lp-toolbar-tip--theme">Lights off</span>
    </button>
  </aside>

  <main class="lp-main">
    <section class="lp-hero">
      <span class="lp-eyebrow">POWERFUL. OPEN-SOURCE. IN BROWSER.</span>
      <div class="lp-headline lp-headline-graph" id="lpHeadlineGraph"
           role="heading" aria-level="1"
           aria-label="The graph collaboration platform for researchers">
        <svg class="lp-edges" aria-hidden="true"></svg>
        <span class="lp-node lp-node--slate" data-word="0"><span class="lp-node-word">The</span></span>
        <span class="lp-node lp-node--blue"  data-word="1"><span class="lp-node-word">graph</span></span>
        <span class="lp-node lp-node--slate" data-word="2"><span class="lp-node-word">collaboration</span></span>
        <span class="lp-node lp-node--slate" data-word="3"><span class="lp-node-word">platform</span></span>
        <span class="lp-node lp-node--slate" data-word="4"><span class="lp-node-word">for</span></span>
        <span class="lp-node lp-node--blue"  data-word="5"><span class="lp-node-word">researchers</span></span>
      </div>
      
      <p class="lp-subhead">
        Collaborate on groundbreaking research, access thousands of public models, and accelerate science.
      </p>
      <div class="lp-hero-cta">
        <a class="lp-btn lp-btn-primary lp-btn-lg" href="graphs-hub.html?tab=dashboard&amp;new=1">Start building</a>
        <a class="lp-btn lp-btn-outline lp-btn-lg" href="graphs-hub.html?tab=community">Explore public graphs</a>
      </div>
    </section>

    <div class="lp-tabs" role="tablist" aria-label="Product modules">
      <button class="lp-tab active" role="tab" aria-selected="true" data-tab="build">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Build
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="path">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.5 17.5C10 13 14 11 17.5 6.5" stroke-dasharray="3 3"/></svg>
        Path
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="plug-in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0l8.57-3.91a1 1 0 0 0 0-1.83L12.83 2.18z"/><path d="M2.6 11.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0l8.57-3.91a1 1 0 0 0 0-1.83"/><path d="M2.6 16.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0l8.57-3.91a1 1 0 0 0 0-1.83"/></svg>
        Plug in
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="experiment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        Experiment
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="discover">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        Discover
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="collaborate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Collaborate
      </button>
    </div>

    <div class="lp-mock-wrap">
      <div class="lp-mock active" data-mock="build">
        <img class="lp-mock-img" alt="" decoding="async"
          data-src-light="images/build-light.png"
          data-src-dark="images/build-dark.png" />
      </div>
      <div class="lp-mock" data-mock="path">
        <img class="lp-mock-img" alt="" decoding="async"
          data-src-light="images/path-light.png"
          data-src-dark="images/path-dark.png" />
      </div>
      <div class="lp-mock" data-mock="plug-in">
        <img class="lp-mock-img" alt="" decoding="async"
          data-src-light="images/plug in-light.png"
          data-src-dark="images/plug in-dark.png" />
      </div>
      <div class="lp-mock" data-mock="experiment">
        <img class="lp-mock-img" alt="" decoding="async"
          data-src-light="images/experiment-light.png"
          data-src-dark="images/experiment-dark.png" />
      </div>
      <div class="lp-mock" data-mock="discover">
        <img class="lp-mock-img" alt="" decoding="async"
          data-src-light="images/discover-light.png"
          data-src-dark="images/discover-dark.png" />
      </div>
      <div class="lp-mock" data-mock="collaborate">
        <img class="lp-mock-img" alt="" decoding="async"
          data-src-light="images/collaborate-light.png"
          data-src-dark="images/collaborate-dark.png" />
      </div>
    </div>
  </main>

  <script src="landing-page.js"></script>
</body>
</html>
