<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectifyAI — Graphs meet Knowledge meet AI</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="landing-page.css" />
</head>
<body>
  <header class="lp-topnav">
    <a class="lp-brand" href="landing-page.html">
      <img src="icons/logo.png" width="28" height="28" alt="" decoding="async" />
      <span class="lp-brand-wordmark">Connectify</span>
    </a>

    <nav class="lp-nav-links" aria-label="Primary">
      <button type="button" class="lp-nav-link">
        Product
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <button type="button" class="lp-nav-link">
        Solutions
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <button type="button" class="lp-nav-link">
        Resources
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <a class="lp-nav-link" href="#">Pricing</a>
    </nav>

    <div class="lp-nav-cta">
      <a class="lp-btn lp-btn-ghost" href="graphs-hub.html?tab=dashboard">Login</a>
      <a class="lp-btn lp-btn-primary" href="graphs-hub.html?tab=dashboard">Get started free</a>
    </div>
  </header>

  <main class="lp-main">
    <section class="lp-hero">
      <span class="lp-eyebrow">SIMPLE. INTELLIGENT. EXTENSIBLE.</span>
      <h1 class="lp-headline">
        Graphs <span class="lp-headline-soft">meet</span> knowledge <span class="lp-headline-soft">meet</span> AI
      </h1>
      <p class="lp-subhead">
        Connectify is the only modern workbench for hyper-fast teams<br />
        that unifies graphs, knowledge, and AI.
      </p>
      <div class="lp-hero-cta">
        <a class="lp-btn lp-btn-primary lp-btn-lg" href="graphs-hub.html?tab=dashboard">Get started free</a>
        <a class="lp-btn lp-btn-outline lp-btn-lg" href="#">Book a demo</a>
      </div>
    </section>

    <div class="lp-tabs" role="tablist" aria-label="Product modules">
      <button class="lp-tab active" role="tab" aria-selected="true" data-tab="graphs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.6 7.7l3 8M16.4 7.7l-3 8M8 6h8"/></svg>
        Graphs
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="wiki">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/></svg>
        Wiki
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="pi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M5 8h14M8 8v10M16 8v10"/></svg>
        Pi
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="intake">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h4l2 3h6l2-3h4"/><path d="M5 19h14a2 2 0 0 0 2-2v-6l-3-7H6L3 11v6a2 2 0 0 0 2 2z"/></svg>
        Intake
      </button>
      <button class="lp-tab" role="tab" aria-selected="false" data-tab="workflows">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M14 7l-3-3M14 7l-3 3"/><path d="M20 17H10M10 17l3-3M10 17l3 3"/></svg>
        Workflows and Approvals
      </button>
    </div>

    <div class="lp-mock-wrap">
      <div class="lp-mock lp-mock-graphs active" data-mock="graphs"></div>
      <div class="lp-mock lp-mock-wiki" data-mock="wiki"></div>
      <div class="lp-mock lp-mock-pi" data-mock="pi"></div>
      <div class="lp-mock lp-mock-intake" data-mock="intake"></div>
      <div class="lp-mock lp-mock-workflows" data-mock="workflows"></div>
    </div>
  </main>

  <script src="landing-page.js"></script>
</body>
</html>
