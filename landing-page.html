<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectifyAI</title>
  <!-- Legacy URL: the landing page now lives at index.html (also served at
       the site root). This shim keeps any bookmarks / external links to
       /landing-page.html working by redirecting to index.html. We point at
       the file explicitly (not "./") so hosts without auto-indexing don't
       show a directory listing. -->
  <meta http-equiv="refresh" content="0;url=index.html" />
  <script>window.location.replace('index.html');</script>
  <link rel="canonical" href="index.html" />
</head>
<body>
  <p style="padding:24px;font-family:system-ui,sans-serif;">
    Redirecting to <a href="index.html">Connectify</a>…
  </p>
</body>
</html>
